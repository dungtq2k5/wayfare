version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Packages are deliberately unversioned (conventions §6.1); buf breaking guards compatibility.
    - PACKAGE_VERSION_SUFFIX
  ignore:
    # Vendored from grpc-health-check; its names are fixed by the gRPC health protocol.
    - proto/grpc/health/v1/health.proto
breaking:
  use:
    - FILE
