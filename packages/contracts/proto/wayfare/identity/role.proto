syntax = "proto3";

// Roles and the permission catalogue — api-endpoints-plan §1.6, §11, rdm-spec I-4, I-5, I-7.
package wayfare.identity;

// Manages custom roles and reads the catalogue. The caller travels as metadata.
service RoleService {
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (SetRolePermissionsResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
}

// A role with its grants.
message Role {
  string id = 1;
  // Generated once, never changed.
  string code = 2;
  string name = 3;
  optional string description = 4;
  bool is_system = 5;
  repeated string permission_codes = 6;
  // Live accounts holding the role.
  int32 holders = 7;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message CreateRoleRequest {
  string name = 1;
  optional string description = 2;
  repeated string permission_codes = 3;
}

message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  string role_id = 1;
  optional string name = 2;
  // An empty string clears the description.
  optional string description = 3;
}

message UpdateRoleResponse {
  Role role = 1;
}

message SetRolePermissionsRequest {
  string role_id = 1;
  repeated string permission_codes = 2;
}

message SetRolePermissionsResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string role_id = 1;
}

message DeleteRoleResponse {}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated PermissionGroupView groups = 1;
}

// One section of the role editor.
message PermissionGroupView {
  string group = 1;
  repeated PermissionView permissions = 2;
}

// One catalogue row (rdm-spec I-5).
message PermissionView {
  string code = 1;
  string description = 2;
  bool is_retired = 3;
}
