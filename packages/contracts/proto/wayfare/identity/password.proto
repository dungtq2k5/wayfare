syntax = "proto3";

// Password reset, account setup and password change — api-endpoints-plan §1.2, rdm-spec I-9.
package wayfare.identity;

// Why an action token was issued (rdm-spec I-9).
enum ActionTokenPurpose {
  ACTION_TOKEN_PURPOSE_UNSPECIFIED = 0;
  ACTION_TOKEN_PURPOSE_PASSWORD_RESET = 1;
  ACTION_TOKEN_PURPOSE_EMAIL_VERIFICATION = 2;
  ACTION_TOKEN_PURPOSE_EMAIL_CHANGE = 3;
  ACTION_TOKEN_PURPOSE_EMAIL_CHANGE_REVERT = 4;
  ACTION_TOKEN_PURPOSE_ACCOUNT_SETUP = 5;
}

// Emailed password links, and the signed-in password change. The caller travels as metadata.
service PasswordService {
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ValidateResetToken(ValidateResetTokenRequest) returns (ValidateResetTokenResponse);
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (CompletePasswordResetResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {}

message ValidateResetTokenRequest {
  // Secret: never logged.
  string token = 1;
}

message ValidateResetTokenResponse {
  // PASSWORD_RESET or ACCOUNT_SETUP.
  ActionTokenPurpose purpose = 1;
  string email_masked = 2;
}

message CompletePasswordResetRequest {
  // Secret: never logged.
  string token = 1;
  // Secret: never logged.
  string new_password = 2;
}

message CompletePasswordResetResponse {}

message ChangePasswordRequest {
  // Secret: never logged.
  string current_password = 1;
  // Secret: never logged.
  string new_password = 2;
}

message ChangePasswordResponse {}
