syntax = "proto3";

// Accounts and sessions — api-endpoints-plan §1.2, rdm-spec I-1, I-3.
package wayfare.identity;

import "google/protobuf/timestamp.proto";

// How a session was opened; decides the token transport (rdm-spec I-3).
enum SessionClient {
  SESSION_CLIENT_UNSPECIFIED = 0;
  SESSION_CLIENT_CONSOLE = 1;
  SESSION_CLIENT_WEB = 2;
  SESSION_CLIENT_MOBILE = 3;
}

// Signs people in and out. The caller (and any device) travels as metadata.
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);
  rpc ClaimDevice(ClaimDeviceRequest) returns (ClaimDeviceResponse);
  // Internal, called by the gateway only (api-endpoints-plan §12.2).
  rpc GetTokenCutoff(GetTokenCutoffRequest) returns (GetTokenCutoffResponse);
  // Continue with Google (ADRs 0062–0064): a nonce for the caller's device, then the token that
  // carries it — signs in, creates, links, or asks for the password first.
  rpc GoogleNonce(GoogleNonceRequest) returns (GoogleNonceResponse);
  rpc GoogleSignIn(GoogleSignInRequest) returns (GoogleSignInResponse);
  // A fresh token for the caller's linked Google account, in place of the current password.
  rpc GoogleConfirm(GoogleConfirmRequest) returns (GoogleConfirmResponse);
  // Links the ticket's Google account after the password sign-in it asked for (ADR 0064).
  rpc GoogleLink(GoogleLinkRequest) returns (GoogleLinkResponse);
  rpc UnlinkGoogle(UnlinkGoogleRequest) returns (UnlinkGoogleResponse);
  // Development only — absent unless identity runs with GOOGLE_ISSUER=fake.
  rpc MintFakeGoogleToken(MintFakeGoogleTokenRequest) returns (MintFakeGoogleTokenResponse);
}

message RegisterRequest {
  string email = 1;
  // Secret: never logged.
  string password = 2;
  optional string full_name = 3;
  string preferred_locale = 4;
  string terms_version = 5;
  SessionClient client = 6;
}

message LoginRequest {
  string email = 1;
  // Secret: never logged.
  string password = 2;
  SessionClient client = 3;
}

message RefreshRequest {
  // Secret: never logged.
  string refresh_token = 1;
  SessionClient client = 2;
}

message LogoutRequest {
  // Used only when the caller has no valid access token. Secret: never logged.
  optional string refresh_token = 1;
}

message LogoutAllRequest {}

message LogoutResponse {}

message LogoutAllResponse {}

message ClaimDeviceRequest {}

message ClaimDeviceResponse {}

message GetTokenCutoffRequest {
  string user_id = 1;
}

message GetTokenCutoffResponse {
  // Milliseconds since the epoch; absent when the user has no cutoff.
  optional int64 tokens_valid_after_ms = 1;
}

// The signed-in person, as every session response carries it.
message SessionUser {
  string id = 1;
  string email = 2;
  optional string full_name = 3;
  string preferred_locale = 4;
  bool is_email_verified = 5;
  google.protobuf.Timestamp created_at = 6;
  // A hard bounce was recorded since the address was last verified.
  bool email_bounced = 7;
}

message RegisterResponse {
  Session session = 1;
}

message LoginResponse {
  Session session = 1;
}

message RefreshResponse {
  Session session = 1;
}

// A freshly opened or rotated session.
message Session {
  SessionUser user = 1;
  string access_token = 2;
  google.protobuf.Timestamp access_expires_at = 3;
  // Secret: never logged.
  string refresh_token = 4;
  google.protobuf.Timestamp refresh_expires_at = 5;
}

// What a Google sign-in did (api-endpoints-plan §1.2).
enum GoogleOutcome {
  GOOGLE_OUTCOME_UNSPECIFIED = 0;
  GOOGLE_OUTCOME_CREATED = 1;
  GOOGLE_OUTCOME_SIGNED_IN = 2;
  GOOGLE_OUTCOME_LINKED = 3;
  GOOGLE_OUTCOME_LINKED_PASSWORD_REMOVED = 4;
}

message GoogleNonceRequest {
  // The console's binding value, for a caller with no device (the gateway's `wf_gn` cookie).
  // Secret: never logged.
  optional string binding = 1;
}

message GoogleNonceResponse {
  string nonce = 1;
}

message GoogleSignInRequest {
  // Secret: never logged.
  string id_token = 1;
  string preferred_locale = 2;
  SessionClient client = 3;
  // The binding value the nonce was issued against, for a caller with no device.
  // Secret: never logged.
  optional string binding = 4;
}

message GoogleSignInResponse {
  Session session = 1;
  GoogleOutcome outcome = 2;
}

message GoogleConfirmRequest {
  // Secret: never logged.
  string id_token = 1;
}

message GoogleConfirmResponse {
  string confirmation = 1;
}

message GoogleLinkRequest {
  string link_ticket = 1;
}

message GoogleLinkResponse {}

// Exactly one of the two: the current password, or a Google confirmation.
message UnlinkGoogleRequest {
  // Secret: never logged.
  string current_password = 1;
  string confirmation = 2;
}

message UnlinkGoogleResponse {}

message MintFakeGoogleTokenRequest {
  string email = 1;
  optional string name = 2;
  optional string sub = 3;
  bool email_verified = 4;
  optional string hd = 5;
  string nonce = 6;
}

message MintFakeGoogleTokenResponse {
  string id_token = 1;
}
