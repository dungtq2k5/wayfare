syntax = "proto3";

// The synthesis job monitor — api-endpoints-plan §4.3, rdm-spec N-1, N-2.
package wayfare.narration;

import "google/protobuf/timestamp.proto";
import "wayfare/common/localization.proto";
import "wayfare/common/page.proto";

// Lists, creates, pauses, resumes, cancels and retries jobs; reports providers and voices.
service SynthesisAdminService {
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc CreateManualJob(CreateManualJobRequest) returns (CreateManualJobResponse);
  rpc PauseJob(PauseJobRequest) returns (PauseJobResponse);
  rpc ResumeJob(ResumeJobRequest) returns (ResumeJobResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc RetryFailedTasks(RetryFailedTasksRequest) returns (RetryFailedTasksResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc ListVoices(ListVoicesRequest) returns (ListVoicesResponse);
}

// Why a job exists (rdm-spec N-1).
enum SynthesisTrigger {
  SYNTHESIS_TRIGGER_UNSPECIFIED = 0;
  SYNTHESIS_TRIGGER_APPROVAL = 1;
  SYNTHESIS_TRIGGER_CONTENT_CHANGED = 2;
  SYNTHESIS_TRIGGER_ON_DEMAND = 3;
  SYNTHESIS_TRIGGER_PREFETCH = 4;
  SYNTHESIS_TRIGGER_HOTSET = 5;
  SYNTHESIS_TRIGGER_WARMUP = 6;
  SYNTHESIS_TRIGGER_DICTIONARY_CHANGED = 7;
  SYNTHESIS_TRIGGER_ENTITLEMENT_EXPANDED = 8;
  SYNTHESIS_TRIGGER_HUMAN_EDIT = 9;
  SYNTHESIS_TRIGGER_HUMAN_REVERT = 10;
  SYNTHESIS_TRIGGER_MANUAL = 11;
}

// A job's state (rdm-spec N-1).
enum SynthesisJobStatus {
  SYNTHESIS_JOB_STATUS_UNSPECIFIED = 0;
  SYNTHESIS_JOB_STATUS_QUEUED = 1;
  SYNTHESIS_JOB_STATUS_RUNNING = 2;
  SYNTHESIS_JOB_STATUS_PAUSED = 3;
  SYNTHESIS_JOB_STATUS_COMPLETED = 4;
  SYNTHESIS_JOB_STATUS_PARTIALLY_FAILED = 5;
  SYNTHESIS_JOB_STATUS_FAILED = 6;
  SYNTHESIS_JOB_STATUS_CANCELLED = 7;
  SYNTHESIS_JOB_STATUS_SUPERSEDED = 8;
}

// A task's step (rdm-spec N-2).
enum SynthesisStage {
  SYNTHESIS_STAGE_UNSPECIFIED = 0;
  SYNTHESIS_STAGE_TRANSLATE = 1;
  SYNTHESIS_STAGE_PRONOUNCE = 2;
  SYNTHESIS_STAGE_SYNTHESIZE = 3;
  SYNTHESIS_STAGE_STORE = 4;
  SYNTHESIS_STAGE_PUBLISH = 5;
}

// A task's state (rdm-spec N-2).
enum SynthesisTaskStatus {
  SYNTHESIS_TASK_STATUS_UNSPECIFIED = 0;
  SYNTHESIS_TASK_STATUS_QUEUED = 1;
  SYNTHESIS_TASK_STATUS_RUNNING = 2;
  SYNTHESIS_TASK_STATUS_SUCCEEDED = 3;
  SYNTHESIS_TASK_STATUS_FAILED = 4;
  SYNTHESIS_TASK_STATUS_CANCELLED = 5;
  SYNTHESIS_TASK_STATUS_COALESCED = 6;
}

message SynthesisJob {
  string id = 1;
  wayfare.common.LocalizationTargetType target_type = 2;
  optional string target_id = 3;
  SynthesisTrigger trigger = 4;
  string source_content_hash = 5;
  repeated string requested_langs = 6;
  bool include_audio = 7;
  int32 priority = 8;
  SynthesisJobStatus status = 9;
  int32 total_tasks = 10;
  int32 completed_tasks = 11;
  int32 failed_tasks = 12;
  optional string requested_by_user_id = 13;
  optional string requested_by_device_id = 14;
  optional string error_summary = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp started_at = 17;
  google.protobuf.Timestamp finished_at = 18;
}

message SynthesisTask {
  string id = 1;
  string lang = 2;
  SynthesisStage stage = 3;
  SynthesisTaskStatus status = 4;
  int32 attempts = 5;
  optional string translation_provider = 6;
  optional string speech_provider = 7;
  optional string voice_id = 8;
  optional string cache_key = 9;
  optional string coalesced_into_task_id = 10;
  // Redacted.
  optional string last_error = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp finished_at = 13;
}

message ListJobsRequest {
  wayfare.common.PageNumberRequest page = 1;
  optional SynthesisJobStatus status = 2;
  optional wayfare.common.LocalizationTargetType target_type = 3;
  optional string target_id = 4;
  optional SynthesisTrigger trigger = 5;
}

message ListJobsResponse {
  repeated SynthesisJob jobs = 1;
  wayfare.common.PageNumberMeta page = 2;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  SynthesisJob job = 1;
  repeated SynthesisTask tasks = 2;
}

message CreateManualJobRequest {
  wayfare.common.LocalizationTargetType target_type = 1;
  string target_id = 2;
  repeated string langs = 3;
  bool include_audio = 4;
}

message CreateManualJobResponse {
  SynthesisJob job = 1;
}

message PauseJobRequest {
  string job_id = 1;
}

message PauseJobResponse {
  SynthesisJob job = 1;
}

message ResumeJobRequest {
  string job_id = 1;
}

message ResumeJobResponse {
  SynthesisJob job = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  SynthesisJob job = 1;
}

message RetryFailedTasksRequest {
  string job_id = 1;
}

message RetryFailedTasksResponse {
  SynthesisJob job = 1;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated ProviderHealth providers = 1;
}

// One provider, as this process sees it.
message ProviderHealth {
  string name = 1;
  // `translation` or `speech`.
  string role = 2;
  int32 position = 3;
  // `closed` or `open`.
  string breaker = 4;
  int32 consecutive_failures = 5;
  double error_rate = 6;
  int32 recent_calls = 7;
  google.protobuf.Timestamp cooling_until = 8;
}

message ListVoicesRequest {}

message ListVoicesResponse {
  repeated VoiceCatalogue voices = 1;
}

message VoiceCatalogue {
  string lang = 1;
  string provider = 2;
  optional string pinned_voice_id = 3;
  repeated Voice available = 4;
}

message Voice {
  string id = 1;
  string language_code = 2;
  optional string gender = 3;
}
