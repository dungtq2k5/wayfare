syntax = "proto3";

// What narration reads before localizing — api-endpoints-plan §12.2, rdm-spec §1.5, C-4.
// Internal: never routed, called with a system context.
package wayfare.catalog;

import "wayfare/catalog/place_types.proto";
import "wayfare/common/localization.proto";
import "wayfare/common/page.proto";

// catalog's service-to-service reads. A tourist route never reaches it.
service PlaceService {
  // The target's source text as it is now, and its localizations' state.
  rpc GetLocalizationSource(GetLocalizationSourceRequest) returns (GetLocalizationSourceResponse);
  // An owner's Venues that count against their place limit (rdm-spec C-1) — billing's projections.
  rpc CountOwnerPlaces(CountOwnerPlacesRequest) returns (CountOwnerPlacesResponse);
  // Live localizations whose text holds a term, whole-word — what a dictionary edit re-voices.
  rpc SearchLocalizedText(SearchLocalizedTextRequest) returns (SearchLocalizedTextResponse);
  // The nearest ACTIVE Places and their readiness — what a language switch warms up.
  rpc ListNarrationCandidates(ListNarrationCandidatesRequest)
      returns (ListNarrationCandidatesResponse);
}

// Distance only, nearest first: boost never reaches narration (ADR 0007).
message ListNarrationCandidatesRequest {
  double lat = 1;
  double lng = 2;
  int32 radius_m = 3;
  int32 limit = 4;
  // The language whose readiness is reported.
  string lang = 5;
}

message ListNarrationCandidatesResponse {
  repeated NarrationCandidate candidates = 1;
}

// One nearby Place: its current source version, and what exists for the requested language.
message NarrationCandidate {
  string place_id = 1;
  string content_hash = 2;
  // A Place with no row for the language is false, false — not omitted.
  bool text_ready = 3;
  bool audio_ready = 4;
}

message SearchLocalizedTextRequest {
  // The term as written, with its diacritics; matched whole-word, case-insensitively.
  string term = 1;
  // Empty means every language.
  repeated string langs = 2;
  wayfare.common.PageRequest page = 3;
}

message SearchLocalizedTextResponse {
  repeated LocalizedTextMatch items = 1;
  wayfare.common.CursorPage page = 2;
}

// One localization row whose text holds the term.
message LocalizedTextMatch {
  wayfare.common.LocalizationTargetType target_type = 1;
  string target_id = 2;
  string lang = 3;
  // The source version this row was made from (rdm-spec C-4).
  string source_content_hash = 4;
}

message CountOwnerPlacesRequest {
  string owner_user_id = 1;
}

message CountOwnerPlacesResponse {
  int32 count = 1;
}

message GetLocalizationSourceRequest {
  wayfare.common.LocalizationTargetType target_type = 1;
  string target_id = 2;
}

// Exactly one of the three.
message GetLocalizationSourceResponse {
  oneof result {
    LocalizationSourcePlace place = 1;
    LocalizationSourceMenuItem menu_item = 2;
    // The target never existed, or a menu item was deleted. A deleted Place is a `place`.
    LocalizationSourceNotFound not_found = 3;
  }
}

message LocalizationSourcePlace {
  PlaceKind kind = 1;
  PlaceStatus status = 2;
  bool deleted = 3;
  string content_hash = 4;
  string name_vi = 5;
  string description_vi = 6;
  optional string owner_user_id = 7;
  repeated LocalizationState localizations = 8;
}

// One language's row (rdm-spec C-4): its text's version and its audio, as an object path.
message LocalizationState {
  string lang = 1;
  string source_content_hash = 2;
  TranslationSource translation_source = 3;
  AudioStatus audio_status = 4;
  optional string audio_source_content_hash = 5;
  optional string audio_object_path = 6;
  optional string audio_sha256 = 7;
  optional int32 audio_bytes = 8;
  optional int32 audio_duration_ms = 9;
  // The text served now, which the correction screen shows beside its correction (§4.5).
  string name = 10;
  string description = 11;
}

message LocalizationSourceMenuItem {
  string place_id = 1;
  string content_hash = 2;
  string name_vi = 3;
  optional string description_vi = 4;
}

message LocalizationSourceNotFound {}
