sonar.projectKey=dungtq2k5_wayfare
sonar.organization=dungtq2k5
sonar.projectName=wayfare
sonar.sources=.
# Generated: the API client's spec and code, and the app's native folders (Continuous Native Generation).
sonar.exclusions=**/node_modules/**,**/dist/**,**/generated/**,**/coverage/**,**/.turbo/**,docs/archive/**,infra/tiles/.cache/**,.cache/**,packages/api-client/openapi.json,apps/mobile/android/**,apps/mobile/.expo/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is CI's merged unit and integration report (vitest.config.mts, architecture §12). The
# first group is vitest.config.mts's coverageExclude, glob for glob, with its reasons there; the
# second is everything outside the source it counts (an app's, service's or package's src, the
# mobile app's routes and modules), which Sonar can't say as "everything except": tests and their
# support, the database's migrations and seed data, scripts, infrastructure, tool configuration.
# packages/config/guards/coverage-exclusions.spec.ts fails when the two drift.
sonar.coverage.exclusions=\
**/node_modules/**,**/*.spec.ts,**/*.spec.tsx,**/generated/**,**/src/main.ts,**/src/instrumentation.ts,\
**/*.module.ts,**/src/scripts/**,**/src/testing/**,packages/core/src/geofence/trace-generator.ts,**/*.d.ts,\
*.js,*.mjs,*.mts,*.ts,infra/**,\
apps/*/*.js,apps/*/*.mjs,apps/*/*.ts,apps/*/e2e/**,apps/*/.maestro/**,apps/*/scripts/**,\
services/*/*.ts,services/*/test/**,services/*/prisma/**,services/*/scripts/**,\
packages/*/*.mjs,packages/*/*.ts,packages/*/scripts/**,packages/*/build/**,packages/config/**

# An applied Prisma migration is never edited. Oracle's CHAR/VARCHAR2 rule doesn't apply to
# PostgreSQL, where CHAR(64) (a SHA-256 hex) and CHAR(3) (a currency) are rdm-spec's own types.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:CharVarchar
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.sql
# Local containers' credentials, published on loopback only (127.0.0.1 — see infra/docker/compose.yaml).
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e2.resourceKey=infra/docker/compose.yaml
