sonar.projectKey=dungtq2k5_wayfare
sonar.organization=dungtq2k5
sonar.projectName=wayfare
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/generated/**,**/coverage/**,**/.turbo/**,docs/archive/**,infra/tiles/.cache/**,.cache/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is measured only on packages/core/src (architecture §12.2, conventions §17.3) —
# mirrors vitest.config.mts's coverage.include. Sonar's patterns can't say "everything except
# this folder", so every other package, service and the repo root's own files are spelled out.
sonar.coverage.exclusions=services/**,apps/**,infra/**,packages/config/**,packages/contracts/**,\
packages/i18n/**,packages/nest-common/**,*.mjs,*.mts,*.ts,\
packages/core/src/**/*.spec.ts,packages/core/src/**/index.ts,packages/core/src/geofence/trace-generator.ts

# An applied Prisma migration is never edited. Oracle's CHAR/VARCHAR2 rule doesn't apply to
# PostgreSQL, where CHAR(64) (a SHA-256 hex) and CHAR(3) (a currency) are rdm-spec's own types.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:CharVarchar
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.sql
# Local containers' credentials, published on loopback only (127.0.0.1 — see infra/docker/compose.yaml).
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.e2.resourceKey=infra/docker/compose.yaml
