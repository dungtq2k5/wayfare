name: e2e

# The Playwright suites (architecture §12), beside the merge gate in pr.yml: each job on its own
# fresh stack, the screens' stack a developer runs them on (apps/console/e2e/screens/stack.sh), so
# a run here and a run on a laptop see the same ports, seed and build. A newer push cancels the
# older run.
# Every action from outside the repository is pinned to its release's full commit, the version
# in a comment beside it: a tag can be moved to other code (SonarCloud's githubactions:S7637).
# Dependabot's github-actions updates move both.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      order:
        description: Run the screens' order check instead (their shards last to first)
        type: boolean
        default: false
  # Monday 02:00 in Vietnam: the screens' order check (conventions §12.8).
  schedule:
    - cron: '0 19 * * 0'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every suite on every pull request, the screens included: they draw the services' real answers,
  # so a change anywhere can move them, and they run beside the flows, so the wall time is the
  # slowest job's. The console's baselines in four plain shards, each on a fresh stack: no screens
  # file depends on another (conventions §12.8), which the weekly order check below proves.
  suite:
    if: github.event_name != 'schedule' && !inputs.order
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: console screens 1/4,
              key: console-screens-1,
              app: console,
              run: test:screens,
              shard: 1/4,
              timeout: 40,
            }
          - {
              name: console screens 2/4,
              key: console-screens-2,
              app: console,
              run: test:screens,
              shard: 2/4,
              timeout: 40,
            }
          - {
              name: console screens 3/4,
              key: console-screens-3,
              app: console,
              run: test:screens,
              shard: 3/4,
              timeout: 40,
            }
          - {
              name: console screens 4/4,
              key: console-screens-4,
              app: console,
              run: test:screens,
              shard: 4/4,
              timeout: 40,
            }
          - { name: web screens, key: web-screens, app: web, run: test:screens, timeout: 30 }
          - {
              name: console flows,
              key: console-flows,
              app: console,
              run: e2e,
              flows: true,
              timeout: 30,
            }
          - { name: web flows, key: web-flows, app: web, run: e2e, flows: true, timeout: 25 }
    env:
      E2E_STACK: screens
      # The stack's image builds read Buildx's GitHub Actions cache; the gate's `images` job writes it.
      STACK_COMPOSE_FILE: infra/docker/compose.ci-read.yaml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          # The packages the app imports, compiled; its web server builds the app itself.
          build: '@wayfare/${{ matrix.app }}^...'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # The runner is thrown away; removing the builder only adds minutes.
          cleanup: false
      # The cache's token and URLs, for the stack's `docker compose` build.
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      # The flows run in this machine's Chromium; the screens in the pinned image's (screens/browser.ts).
      - name: Cache Playwright's Chromium
        if: matrix.flows
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: matrix.flows
        run: pnpm --filter @wayfare/${{ matrix.app }} exec playwright install --with-deps chromium

      # The runner's load every 5 s, for a failure to be read against: a 2-vCPU runner holding the
      # stack, the app's server and a browser can starve a service past the gateway's 2 s deadline.
      - name: Sample the runner's load
        run: (vmstat -t 5 > "$RUNNER_TEMP/vmstat.log" &)

      - name: A fresh stack, migrated and seeded
        run: apps/console/e2e/screens/stack.sh up

      - name: ${{ matrix.name }}
        id: suite
        run: >-
          pnpm --filter @wayfare/${{ matrix.app }} ${{ matrix.run }}
          ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}

      # A test that failed and then passed on its retry passes the job: it is named in a warning,
      # and its evidence kept as a failure's is (an artefact ending `-flaky`). Reported, not hidden,
      # and not failed.
      - name: Flaky tests
        id: flaky
        if: steps.suite.outcome == 'success'
        run: |
          report=apps/${{ matrix.app }}/test-results/results.json
          [ -f "$report" ] || exit 0
          count=$(jq '.stats.flaky // 0' "$report")
          [ "$count" -gt 0 ] || exit 0
          names=$(jq -r '[.. | objects | select(has("specs")) | .specs[]
            | select(any(.tests[]?; .status == "flaky")) | "\(.file) › \(.title)"]
            | unique | join("; ")' "$report")
          echo "::warning title=${count} flaky in ${{ matrix.name }}::Passed only on its retry: ${names}"
          echo "found=true" >> "$GITHUB_OUTPUT"

      # Every service's whole log, with times, beside the report: a failure early in a long run
      # is gone from any tail by the time the job ends.
      - name: Stack logs on failure
        if: failure() || steps.flaky.outputs.found == 'true'
        run: |
          mkdir -p apps/${{ matrix.app }}/test-results
          docker compose -p wayfare-screens -f compose.yaml -f infra/docker/compose.screens.yaml \
            --profile apps logs --no-color --timestamps > apps/${{ matrix.app }}/test-results/stack.log
          cp "$RUNNER_TEMP/vmstat.log" apps/${{ matrix.app }}/test-results/ || true

      - name: Playwright report on failure
        if: failure() || steps.flaky.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # An artefact's name can't hold `:`: the suite's own key, `-flaky` when the job passed.
          name: playwright-${{ matrix.key }}${{ steps.flaky.outputs.found == 'true' && '-flaky' || '' }}
          # The report, each moved screen's expected, actual and diff images, and the stack's logs.
          path: |
            apps/${{ matrix.app }}/playwright-report
            apps/${{ matrix.app }}/test-results

  # One check for branch protection: every suite this run needed passed.
  e2e:
    if: always() && github.event_name != 'schedule' && !inputs.order
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.suite.result }}" = success

  # Conventions §12.8's order check, weekly: the console's screens shards last to first on one
  # stack (apps/console/e2e/screens/order-check.sh). A new dependency between files fails here.
  order:
    if: github.event_name == 'schedule' || inputs.order
    name: screens order check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STACK_COMPOSE_FILE: infra/docker/compose.ci-read.yaml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          build: '@wayfare/console^...'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          cleanup: false
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0
      - name: Sample the runner's load
        run: (vmstat -t 5 > "$RUNNER_TEMP/vmstat.log" &)
      - run: apps/console/e2e/screens/order-check.sh
      - name: Stack logs on failure
        if: failure()
        run: |
          mkdir -p apps/console/test-results
          docker compose -p wayfare-screens -f compose.yaml -f infra/docker/compose.screens.yaml \
            --profile apps logs --no-color --timestamps > apps/console/test-results/stack.log
          cp "$RUNNER_TEMP/vmstat.log" apps/console/test-results/ || true
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-screens-order
          path: |
            apps/console/playwright-report
            apps/console/test-results
