name: pr

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm's exact version comes from `packageManager` in package.json.
      - run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # strictDepBuilds: an unlisted dependency build script fails here.
      - run: pnpm install --frozen-lockfile

      # The .env.example files are complete and hold no secrets.
      - name: Use the example environment
        run: for s in services/*; do cp "$s/.env.example" "$s/.env"; done

      # The examples leave every *KEY* empty; a throwaway signing pair fills them.
      - name: Generate development signing keys
        run: pnpm keys:dev

      # Before typecheck on purpose: a stale committed client makes every later error a lie.
      - name: Generated gRPC code is committed and current
        run: pnpm proto:generate && git diff --exit-code -- packages/contracts/src/generated

      - run: pnpm proto:lint

      # The gateway's document and the client generated from it; an untracked file counts as a diff.
      - name: The OpenAPI spec and the API client are committed and current
        run: |
          pnpm api:generate
          test -z "$(git status --porcelain -- packages/api-client)"

      # The writer spec fails on a stale file; the diff makes the fix visible in the log.
      - name: The i18n argument types are committed and current
        run: |
          pnpm i18n:types
          test -z "$(git status --porcelain -- packages/i18n/src/generated)"

      # The Prisma client is gitignored, so it is generated before anything reads its types.
      - run: pnpm db:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lint:md
      # Guard specs also run inside `pnpm test`; this step names them so a failure reads as a rule, not a unit test.
      - run: pnpm vitest run --project unit:guards
      - run: pnpm build
      # The JavaScript bundle builds with no device and no EAS: a Node-only import stops the pull request.
      - run: pnpm --filter @wayfare/mobile bundle:check
      - run: pnpm test
      # packages/core carries a coverage bar (conventions §17.3).
      - run: pnpm test:coverage

      - name: Boot the stack
        run: docker compose up -d --wait

      - name: Migrate, apply schema objects, verify, check drift
        run: pnpm db:setup && pnpm db:verify && pnpm db:drift

      - run: pnpm test:integration

      # The emulator starts empty; catalog is not ready without its media bucket.
      - name: Create the media bucket
        run: pnpm --filter @wayfare/catalog storage:setup

      - name: Images build and boot
        run: docker compose --profile apps up -d --build --wait

      - name: Smoke-test the running images
        run: |
          curl -fsS localhost:13000/health/ready
          curl -fsS localhost:3101/health/ready
          curl -fsS localhost:3102/health/ready
          curl -fsS localhost:3104/health/ready
          curl -fsS localhost:13000/api/v1/categories -H 'x-wayfare-client: web'
          curl -fsS -X POST localhost:13000/api/v1/devices \
            -H 'content-type: application/json' -H 'x-wayfare-client: mobile' \
            -d '{"platform":"ANDROID","appVersion":"0.1.0","contentLocale":"en","privacyPolicyVersion":"2026-09-01"}'

      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile apps logs --no-color --tail=200
