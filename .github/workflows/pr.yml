name: pr

# The merge gate product §13 times: parallel jobs, the gate's time being the slowest one's. The
# Playwright suites run beside it in e2e.yml.
# Every action from outside the repository is pinned to its release's full commit, the version
# in a comment beside it: a tag can be moved to other code (SonarCloud's githubactions:S7637).
# Dependabot's github-actions updates move both.
on:
  pull_request:
  push:
    branches: [main]
  # Run by hand for the secrets job's full-history scan.
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gitleaks (.gitleaks.toml): on a pull request, its commits; on a push, the pushed ones; run by
  # hand, the whole history. A real secret found is rotated, not just deleted.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.24.3

  # SonarCloud's analysis of the pull request (or of main, on a push to it) and its quality gate
  # (architecture §12). It reads the coverage of both vitest tiers, merged here from the blob
  # reports `checks` and `integration` leave; the merge also holds the project's coverage bar.
  # The job fails with either. CI is the only sender: a laptop's analysis would overwrite main's.
  sonar:
    # The full-history scan alone when run by hand. Never skipped otherwise: a skipped job would
    # satisfy the required check, and an unanalysed pull request could merge.
    if: github.event_name != 'workflow_dispatch'
    needs: [checks, integration]
    runs-on: ubuntu-latest
    # 3.9 minutes measured when it ran core's unit suite itself; it now waits for the tiers instead.
    timeout-minutes: 10
    steps:
      # A fork's pull request gets no secrets: it fails here, never passes unanalysed.
      - name: A token to analyse with
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::no SONAR_TOKEN — a fork's pull request is analysed once its branch is pushed to this repository"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Blame and new-code detection read the history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true
      # One lcov for the scanner, and the coverage bar (vitest.config.mts) checked on it.
      - run: pnpm coverage:report
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Waits for the quality gate, and fails with it.
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # The static checks and the unit suites.
  checks:
    # The full-history scan alone when run by hand.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup

      # A known hole in a shipped package fails the pull request; accepted advisories are listed,
      # each with its reason, under auditConfig in pnpm-workspace.yaml.
      - run: pnpm audit --prod --audit-level=high

      # Before typecheck on purpose: a stale committed client makes every later error a lie.
      - name: Generated gRPC code is committed and current
        run: pnpm proto:generate && git diff --exit-code -- packages/contracts/src/generated

      - run: pnpm proto:lint

      # The gateway's document and the client generated from it; an untracked file counts as a diff.
      - name: The OpenAPI spec and the API client are committed and current
        run: |
          pnpm api:generate
          test -z "$(git status --porcelain -- packages/api-client)"

      # The writer spec fails on a stale file; the diff makes the fix visible in the log.
      - name: The i18n argument types are committed and current
        run: |
          pnpm i18n:types
          test -z "$(git status --porcelain -- packages/i18n/src/generated)"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lint:md
      # Guard specs also run inside `pnpm test`; this step names them so a failure reads as a rule, not a unit test.
      - run: pnpm vitest run --project unit:guards
      # The unit suites, with their coverage kept for the merge in `sonar`.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-blob-unit
          path: .vitest-reports/unit.json
          include-hidden-files: true
          retention-days: 3

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The JavaScript bundle builds with no device and no EAS: a Node-only import stops the pull request.
      - run: pnpm --filter @wayfare/mobile bundle:check

  # The databases' migrations and the integration suites against the stack's infrastructure.
  integration:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup

      - name: Boot the stack
        run: docker compose up -d --wait

      - name: Migrate, apply schema objects, verify, check drift
        run: pnpm db:setup && pnpm db:verify && pnpm db:drift

      # The integration suites, with their coverage kept for the merge in `sonar`.
      - run: pnpm test:integration:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-blob-integration
          path: .vitest-reports/integration.json
          include-hidden-files: true
          retention-days: 3

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  # The services' images build, boot against the stack, and answer.
  images:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Each service's image build reads and writes Buildx's GitHub Actions cache.
      COMPOSE_FILE: compose.yaml:infra/docker/compose.ci.yaml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away; removing the builder took 100 s.
          cleanup: false
      # The cache's token and URLs, for the `docker compose` steps below.
      - uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124 # v3.1.0

      - name: Boot the stack
        run: docker compose up -d --wait

      - name: Migrate
        run: pnpm db:setup

      # The emulator starts empty; catalog is not ready without its media bucket.
      - name: Create the media bucket
        run: pnpm --filter @wayfare/catalog storage:setup

      - name: Images build and boot
        run: docker compose --profile apps up -d --build --wait

      - name: Smoke-test the running images
        run: |
          curl -fsS localhost:13000/health/ready
          curl -fsS localhost:3101/health/ready
          curl -fsS localhost:3102/health/ready
          curl -fsS localhost:3104/health/ready
          curl -fsS localhost:3105/health/ready
          curl -fsS localhost:13000/api/v1/categories -H 'x-wayfare-client: web'
          curl -fsS -X POST localhost:13000/api/v1/devices \
            -H 'content-type: application/json' -H 'x-wayfare-client: mobile' \
            -d '{"platform":"ANDROID","appVersion":"0.1.0","contentLocale":"en","privacyPolicyVersion":"2026-09-01"}'

      - name: Stack logs on failure
        if: failure()
        run: docker compose --profile apps logs --no-color --tail=200
