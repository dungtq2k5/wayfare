name: setup
description: >-
  Node and pnpm, the workspace installed from the pnpm store's cache, every service's example
  environment, development signing keys, and the Prisma clients: what each job starts from.

inputs:
  build:
    description: >-
      A turbo filter whose packages are built after the install (`@wayfare/console^...`): the
      workspace packages are compiled (their `dist/`), and a job that runs an app needs them.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # pnpm's exact version comes from `packageManager` in package.json.
    - run: corepack enable
      shell: bash

    - name: Locate the pnpm store
      id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    # strictDepBuilds: an unlisted dependency build script fails here.
    - run: pnpm install --frozen-lockfile
      shell: bash

    # Turbo's local cache, per job (and per build filter): a package whose inputs didn't change
    # since this job's last run is replayed, not compiled again. Saved under the commit, restored
    # from the job's latest.
    - uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ inputs.build }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ github.job }}-${{ inputs.build }}-

    # The .env.example files are complete and hold no secrets.
    - name: Use the example environment
      shell: bash
      run: |
        for s in services/*; do cp "$s/.env.example" "$s/.env"; done
        # The console's flows sign in as the dev seed's admin, so the seed needs a password.
        sed -i 's/^SEED_ACCOUNT_PASSWORD=$/SEED_ACCOUNT_PASSWORD=ci seed password/' services/identity/.env

    # The examples leave every *KEY* empty; a throwaway signing pair fills them.
    - name: Generate development signing keys
      run: pnpm keys:dev
      shell: bash

    # The Prisma clients are gitignored, so they are generated before anything reads their types.
    - run: pnpm db:generate
      shell: bash

    - if: inputs.build != ''
      run: pnpm turbo run build --filter="$FILTER"
      shell: bash
      env:
        FILTER: ${{ inputs.build }}
