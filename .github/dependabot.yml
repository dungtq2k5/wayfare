# Updates as reviewable pull requests, weekly. Minor and patch npm updates come grouped; a major
# comes on its own, to be read with its changelog.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly

  # Postgres, Redis, NATS, the storage emulator, Mailpit, Jaeger.
  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
