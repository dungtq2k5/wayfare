packages:
  - apps/*
  - packages/*
  - services/*
ignoredBuiltDependencies:
  # BullMQ's optional msgpack accelerator; its script only rebuilds when no prebuild matches, and
  # msgpackr falls back to plain JavaScript.
  # Install-time telemetry pulled in by swagger-ui-dist; never wanted.
  - '@scarf/scarf'
  # The free speech route; its only script is a `preinstall` that checks the package manager.
  - msedge-tts
  - msgpackr-extract
  # Only prints a version check; the runtime needs nothing it builds.
  - protobufjs
  # Its postinstall only writes the hooks; the root `prepare` script does that instead, and
  # keeps graphify's (see simple-git-hooks in package.json).
  - simple-git-hooks
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - prisma
  - '@prisma/engines'
  - '@prisma/client'
  # Installs the buf binary used by proto:generate / proto:lint.
  - '@bufbuild/buf'
  # Password hashing; its install script only picks the bundled prebuild (glibc or musl).
  - argon2
  # Image processing; its install script only checks the prebuilt libvips package (glibc or musl).
  - sharp
patchedDependencies:
  expo-audio@57.0.5: patches/expo-audio@57.0.5.patch

# pnpm 10 blocks dependency build scripts by default.
# strictDepBuilds turns an unlisted build script into an install failure instead of a warning.
strictDepBuilds: true
