# Run by offline/system.sh with the English pack ready (frame M6, edge 8): the app in 日本語, the pack's
# screen offers the Japanese pack, smaller by the map and the photos already on the phone.
appId: app.wayfare
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Explore'
    timeout: 30000
- runFlow:
    file: ../../common/language-pick.yaml
    env:
      NAME: '日本語'
- extendedWaitUntil:
    visible: '\[ja\] Language'
    timeout: 120000
- runFlow: ../../common/tabs.yaml
- scrollUntilVisible:
    element: '\[ja\] Preferences'
    direction: UP
- tapOn: '\[ja\] Offline downloads'
- tapOn: '.*District 1 centre'
- scrollUntilVisible:
    element: '.*Download in 日本語'
- assertVisible: '.*The map and photos are already on this phone.*'
- runFlow: ../../common/tabs.yaml
- runFlow: ../../common/language-english.yaml
