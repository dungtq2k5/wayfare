# From the tabs: Settings › Offline downloads, then District 1 centre's sheet.
appId: app.wayfare
---
- runFlow: ../../common/tabs.yaml
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Preferences'
    direction: UP
# In *Walk and offline*, below the fold when the Account group is tall (signed in, a notice).
- scrollUntilVisible:
    element: 'Offline downloads'
- tapOn: 'Offline downloads'
- runFlow: sheet.yaml
