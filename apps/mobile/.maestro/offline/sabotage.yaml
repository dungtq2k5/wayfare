# Offline packs under abuse, the parts the app can do by itself: Download tapped twice, a quick
# Pause and Resume, Cancel while checking (edge 1); mobile data (edge 3); no space before and midway
# (edge 4); a file failing its check (frame D6). Each step asserts the state that must follow.
#
# Same set-up as `offline/offline.yaml`, any install with nothing downloaded. The network, a killed app,
# damage, delete while playing, updates, another language and the largest text need adb or the
# admin API: `offline/system.sh` drives them.
#   maestro test apps/mobile/.maestro/offline/sabotage.yaml
appId: app.wayfare
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Explore'
    timeout: 30000
- runFlow:
    file: steps/toggle.yaml
    env:
      LABEL: 'Slow downloads'
      TO: 'on'
- runFlow: steps/delete.yaml
# Edge 1: Download twice starts one download; Pause and Resume quickly leave one running.
- runFlow: steps/sheet.yaml
- tapOn:
    id: 'pack-sheet-download'
    repeat: 2
    delay: 100
- extendedWaitUntil:
    visible: 'Downloading · .*'
    timeout: 10000
- tapOn: 'Pause'
- tapOn: 'Resume'
- assertVisible: 'Downloading · .*'
- tapOn: 'Back'
- assertVisible: 'Downloaded'
- assertVisible: 'Available to download'
# Cancel while checking keeps nothing (frames D4, D8).
- tapOn: 'District 1 centre'
- extendedWaitUntil:
    visible: 'Checking the files…'
    timeout: 120000
- tapOn: 'Cancel'
- extendedWaitUntil:
    visible: 'Download cancelled — nothing was kept'
    timeout: 10000
- assertVisible: 'Nothing downloaded yet'
- assertVisible: 'Download · .*'
# Edge 3: mobile data is named before anything downloads; Wait for Wi-Fi waits; Use mobile data goes on.
- runFlow:
    file: steps/toggle.yaml
    env:
      LABEL: 'Report mobile data'
      TO: 'on'
- runFlow: steps/delete.yaml
- runFlow: steps/sheet.yaml
- assertVisible: 'On mobile data'
- assertVisible: "You're on mobile data. .*"
- tapOn: 'Wait for Wi-Fi'
- extendedWaitUntil:
    visible: 'Waiting for Wi-Fi'
    timeout: 10000
- tapOn: 'Use mobile data'
- extendedWaitUntil:
    visible: 'Downloading · .*'
    timeout: 10000
- tapOn: 'Cancel'
- runFlow:
    file: steps/toggle.yaml
    env:
      LABEL: 'Report mobile data'
      TO: 'off'
# Edge 4: no space before (frame D7) and midway (frame D7b); with room again it goes on.
- runFlow:
    file: steps/toggle.yaml
    env:
      LABEL: 'Report free space'
      TO: '1 MB'
- runFlow: steps/delete.yaml
- runFlow: steps/sheet.yaml
- assertVisible: 'Not enough space: .*'
- tapOn: 'Free up space'
- assertVisible: 'Offline downloads'
- runFlow:
    file: steps/toggle.yaml
    env:
      LABEL: 'Report free space'
      TO: 'off'
- runFlow: steps/delete.yaml
- runFlow: steps/sheet.yaml
- tapOn:
    id: 'pack-sheet-download'
- extendedWaitUntil:
    visible: 'Downloading · .*'
    timeout: 10000
# Paused while the switch is set, so the slowed files cannot all arrive first; Resume then finds
# the phone full partway through.
- tapOn: 'Pause'
- runFlow:
    file: steps/toggle.yaml
    env:
      LABEL: 'Report free space'
      TO: '1 MB'
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Preferences'
    direction: UP
- tapOn: 'Offline downloads'
- tapOn: 'District 1 centre'
- tapOn: 'Resume'
- extendedWaitUntil:
    visible: 'Paused — the phone is full'
    timeout: 30000
- assertVisible: 'Free up space'
- runFlow:
    file: steps/toggle.yaml
    env:
      LABEL: 'Report free space'
      TO: 'off'
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Preferences'
    direction: UP
- tapOn: 'Offline downloads'
- tapOn: 'District 1 centre'
- extendedWaitUntil:
    visible: 'Ready offline'
    timeout: 120000
# Frame D6: a file failing its check twice stops the download; Try again goes on to the end.
- runFlow:
    file: steps/toggle.yaml
    env:
      LABEL: 'Fail the next file'
      TO: 'on'
- runFlow: steps/delete.yaml
- runFlow: steps/sheet.yaml
- tapOn:
    id: 'pack-sheet-download'
- extendedWaitUntil:
    visible: 'Download stopped'
    timeout: 60000
- tapOn: 'Try again'
- extendedWaitUntil:
    visible: 'Ready offline'
    timeout: 120000
- runFlow:
    file: steps/toggle.yaml
    env:
      LABEL: 'Slow downloads'
      TO: 'off'
