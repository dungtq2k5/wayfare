# ADR 0064 (frame K9): an address Google does not own, with an account — the password once, through
# sign-in's limits: a wrong one is sign-in's banner; the right one links Google.
appId: app.wayfare
---
- runFlow: signed-out.yaml
- tapOn:
    id: 'account-sign-in'
- runFlow:
    file: google-pick.yaml
    env:
      EMAIL: ${C}
      WORKSPACE: 'false'
      VERIFIED: 'true'
- extendedWaitUntil:
    visible: 'Link Google'
    timeout: 15000
- assertVisible: 'This address already has a Wayfare account.*'
- tapOn:
    id: 'google-link-password'
- inputText: 'not-the-password'
- hideKeyboard
- tapOn:
    id: 'google-link-submit'
- extendedWaitUntil:
    visible: "That email and password don't match"
    timeout: 15000
- tapOn:
    id: 'google-link-password'
- eraseText: 30
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: 'google-link-submit'
- runFlow: ../../common/no-password-save.yaml
# Signed in (the toast may pass while Google's save sheet is closed): back on Settings, signed in.
- extendedWaitUntil:
    visible:
      id: 'account-entry'
    timeout: 15000
- runFlow: ../../common/tabs.yaml
- tapOn: 'Settings'
- scrollUntilVisible:
    element:
      id: 'account-entry'
    direction: UP
- tapOn:
    id: 'account-entry'
- assertVisible: 'Google or a password'
