# The walk under abuse: double taps, weak GPS, no position, a manual story under the walk, Home and
# back, location off, the largest text, the idle stop. Each step asserts the state that must follow;
# the last asserts nothing is left wrong.
#
# Same set-up as `walk/walk.yaml` (permissions by adb, the Diagnostics build, the 20 s Undo window).
# Location off (W12) and the largest text (edge 10) need the phone's own settings: the sequence is
# in `walk/system.sh`, which drives this flow's neighbours.
#   maestro test apps/mobile/.maestro/walk/sabotage.yaml
appId: app.wayfare
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Explore'
    timeout: 30000
- tapOn: 'Map'
# A walk left on by an earlier run is stopped first.
- runFlow:
    when:
      visible: 'Stop the walk'
    commands:
      - tapOn:
          text: 'Stop the walk'
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible: 'Start walk'
          timeout: 40000
# Two quick taps on Start walk are one walk.
- tapOn:
    text: 'Start walk'
    retryTapIfNoChange: false
    repeat: 2
    delay: 100
- extendedWaitUntil:
    visible: 'Walking · 0 min'
    timeout: 20000
- assertNotVisible: 'Hear stories as you walk'
# Two quick taps on Stop: one toast, Start walk back.
- tapOn:
    text: 'Stop the walk'
    retryTapIfNoChange: false
    repeat: 2
    delay: 100
- assertVisible: 'Walk stopped · .*'
- assertVisible: 'Start walk'
- tapOn:
    text: 'Undo'
    retryTapIfNoChange: false
- assertVisible: 'Walking · .*'
# Simulated weak GPS, then no position.
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Diagnostics'
- tapOn: 'Diagnostics'
- scrollUntilVisible:
    element: 'Simulate walk'
- tapOn: 'Simulate walk'
- tapOn: 'Simulate weak GPS'
- tapOn: 'Back'
- tapOn: 'Map'
- assertVisible: 'Weak GPS — stories wait for a better signal'
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Diagnostics'
- tapOn: 'Diagnostics'
- scrollUntilVisible:
    element: 'Simulate no position'
- tapOn: 'Simulate no position'
- tapOn: 'Back'
- tapOn: 'Map'
- assertVisible: 'Finding your position…'
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Diagnostics'
- tapOn: 'Diagnostics'
- scrollUntilVisible:
    element: 'Simulate no position'
- tapOn: 'Simulate no position'
- tapOn: 'Back'
# Home and back: the same walk.
- pressKey: Home
- launchApp:
    clearState: false
- assertVisible: 'Walking · .*'
# Stand still for 31 minutes of simulated time: the idle stop.
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Diagnostics'
- tapOn: 'Diagnostics'
- scrollUntilVisible:
    element: 'Stand still for 31 minutes'
- tapOn: 'Stand still for 31 minutes'
- extendedWaitUntil:
    visible: 'Back'
    timeout: 5000
- tapOn: 'Back'
- tapOn: 'Map'
- extendedWaitUntil:
    visible: 'Your walk ended'
    timeout: 60000
- assertVisible: 'Start again'
- tapOn: 'Dismiss'
- assertVisible: 'Start walk'
# Nothing left wrong.
- assertNotVisible: 'Walking · .*'
- assertNotVisible: 'Weak GPS.*'
- assertNotVisible: 'Finding your position…'
