# Run by offline-system.sh: a slowed download of District 1 centre under way, on its pack screen,
# so the script can drop the network or kill the app under it (edge 2).
appId: app.wayfare
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Explore'
    timeout: 30000
- runFlow:
    file: offline-toggle.yaml
    env:
      LABEL: 'Slow downloads'
      TO: 'on'
- runFlow: offline-delete.yaml
- runFlow: offline-sheet.yaml
- tapOn:
    id: 'pack-sheet-download'
- extendedWaitUntil:
    visible: 'Downloading · .*'
    timeout: 10000
