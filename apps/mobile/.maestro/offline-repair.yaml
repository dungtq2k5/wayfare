# Run by offline-system.sh after a cold start with a damaged file (frame M4, edge 5): the pack says
# what is affected, and Repair fetches only the broken file.
appId: app.wayfare
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Explore'
    timeout: 30000
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Preferences'
    direction: UP
- tapOn: 'Offline downloads'
- assertVisible: 'Needs repair'
- tapOn: 'District 1 centre'
- assertVisible: 'Some files are damaged'
- assertVisible: '1 story can.t play from this download.*'
- tapOn:
    id: 'pack-repair'
- extendedWaitUntil:
    visible: 'Ready offline'
    timeout: 60000
- runFlow: offline-tabs.yaml
