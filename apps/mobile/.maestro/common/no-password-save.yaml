# Google's "Save password" sheet after a form with an address and a password: closed with Back.
# Neither *Save* (a test password in the phone owner's Google account) nor *Never* (a setting in
# that account) is ever pressed. The sheet can come a moment after the submit, so this waits a
# little for it; nothing to do when it does not show.
appId: app.wayfare
---
- extendedWaitUntil:
    visible: 'Save password to Google\?'
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: 'Save password to Google\?'
    commands:
      - back
