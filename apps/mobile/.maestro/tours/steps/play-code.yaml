# A stop played by its code (the Map's *Scan a code* → *Type the code instead*), to its end. A
# manual play counts for a tour as a walk's does; it doesn't depend on which Place a walk picks.
appId: app.wayfare
---
- tapOn: 'Map'
- tapOn:
    text: 'Scan a code'
    retryTapIfNoChange: false
- tapOn: 'Type the code instead'
- inputText: ${CODE}
- tapOn:
    text: 'Open'
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
# Its story to its end, unless the caller waits for something itself (WAIT=no: a toast at its end).
- runFlow:
    when:
      true: ${WAIT != 'no'}
    commands:
      - extendedWaitUntil:
          visible: 'Pause'
          timeout: 30000
      - extendedWaitUntil:
          notVisible: 'Pause'
          timeout: 120000
