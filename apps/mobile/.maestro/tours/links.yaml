# A tour's link (§3.4 item 2): `wayfare.app/t/T4QX-8MRK` opens the tour; a taken-down tour's link
# answers TM5b. GONE_CODE is a deleted tour's code (tours/gone-tour.mjs). Run by tours/system.sh.
appId: app.wayfare
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Explore'
    timeout: 30000
- openLink: 'https://wayfare.app/t/T4QX-8MRK'
- extendedWaitUntil:
    visible: '.*Danh thắng Quận 1.*'
    timeout: 20000
- assertVisible: "Opened from the tour's code .*"
- back
- openLink: 'https://wayfare.app/t/${GONE_CODE}'
- extendedWaitUntil:
    visible: 'This tour is no longer on Wayfare'
    timeout: 20000
- assertVisible: 'See tours'
