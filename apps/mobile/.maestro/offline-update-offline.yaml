# Run by offline-system.sh with a Place edited on the stack and the network out of reach (edge 7):
# nothing is said offline.
appId: app.wayfare
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Explore'
    timeout: 30000
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Preferences'
    direction: UP
- tapOn: 'Offline downloads'
# Updates by hand first: the automatic switch off, whatever an earlier run left.
- runFlow:
    when:
      visible:
        text: 'Update automatically on Wi-Fi'
        checked: true
    commands:
      - tapOn: 'Update automatically on Wi-Fi'
- assertVisible: 'Ready offline'
- assertNotVisible: 'Update · .*'
