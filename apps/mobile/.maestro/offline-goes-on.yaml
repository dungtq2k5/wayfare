# Run by offline-system.sh with the network back, or after a cold start mid-download (K6, K9):
# the download goes on by itself — the gateway asked again within 30 s — to the end.
appId: app.wayfare
---
- launchApp:
    clearState: false
    stopApp: false
- runFlow: offline-tabs.yaml
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'Preferences'
    direction: UP
- tapOn: 'Offline downloads'
- tapOn: 'District 1 centre'
- extendedWaitUntil:
    visible: 'Downloading · .*|Checking the files…|Ready offline'
    timeout: 60000
- extendedWaitUntil:
    visible: 'Ready offline'
    timeout: 180000
- runFlow:
    file: offline-toggle.yaml
    env:
      LABEL: 'Slow downloads'
      TO: 'off'
