# Run by qr-system.sh with the gateway unreachable and a cold start (edge 4): a code on the phone
# opens offline; one not on it says so.
appId: app.wayfare
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Scan a code'
    timeout: 30000
- runFlow:
    file: qr-type.yaml
    env:
      CODE: 'QK4V1TCX'
- extendedWaitUntil:
    visible: '.*Chợ Bến Thành.*'
    timeout: 15000
- tapOn:
    text: 'Pause'
    retryTapIfNoChange: false
- runFlow:
    file: qr-type.yaml
    env:
      CODE: 'QK4V1TCZ'
- extendedWaitUntil:
    visible: "You're offline"
    timeout: 15000
