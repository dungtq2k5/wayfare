plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.wayfare.googlesignin'
version = '1.0.0'

android {
  namespace "app.wayfare.googlesignin"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Credential Manager and its Google ID option: the platform's current sign-in, not the
  // deprecated Google Sign-In SDK.
  implementation "androidx.credentials:credentials:1.5.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
